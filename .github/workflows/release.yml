name: Release

on:
  release:
    types: [published]

# ── 릴리즈 흐름 ────────────────────────────────────────────────────────────────
#
#  이 리포(commerce-context-mcp)는 소스 코드와 public 릴리즈를 함께 관리합니다.
#  JAR 파일과 checksum은 CI가 테스트한 동일 산출물을 직접 업로드합니다.
#
#  전체 릴리즈 절차:
#  1. vX.Y.Z tag로 GitHub Release를 생성하고 Publish
#  2. Release Publish → 테스트·지식 검증·JAR 빌드
#  3. CI 산출물과 checksum을 Release에 업로드
#  4. 업로드 자산 검증 후 npm publish
#
# ─────────────────────────────────────────────────────────────────────────────

jobs:
  test-and-publish:
    runs-on: ubuntu-latest
    permissions:
      contents: write   # 릴리즈에 .sha256 자산을 업로드하기 위해 필요

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'corretto'

      - name: Extract version
        id: version
        run: |
          VERSION="${GITHUB_REF_NAME#v}"
          if [[ ! "$VERSION" =~ ^[0-9]+\.[0-9]+\.[0-9]+([+-][0-9A-Za-z.-]+)?$ ]]; then
            echo "Invalid semantic version tag: $GITHUB_REF_NAME" >&2
            exit 1
          fi
          echo "VERSION=$VERSION" >> "$GITHUB_OUTPUT"
        env:
          GITHUB_REF_NAME: ${{ github.event.release.tag_name }}

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          registry-url: 'https://registry.npmjs.org'

      - name: Verify declared package version
        working-directory: npm
        env:
          RELEASE_VERSION: ${{ steps.version.outputs.VERSION }}
        run: |
          PACKAGE_VERSION=$(node -p "require('./package.json').version")
          if [[ "$PACKAGE_VERSION" != "$RELEASE_VERSION" ]]; then
            echo "npm/package.json version $PACKAGE_VERSION does not match release $RELEASE_VERSION" >&2
            exit 1
          fi

      - name: Cache Gradle
        uses: actions/cache@v4
        with:
          path: |
            ~/.gradle/caches
            ~/.gradle/wrapper
          key: gradle-${{ hashFiles('**/*.gradle.kts', '**/gradle-wrapper.properties') }}

      # ── 전체 테스트와 지식 YAML 스키마 통과 확인 ─────────────────────────────
      - name: Validate knowledge & build
        run: |
          chmod +x gradlew
          ./gradlew validateKnowledge bootJar "-Pversion=${{ steps.version.outputs.VERSION }}" --no-daemon

      # ── 테스트한 CI JAR와 체크섬을 그대로 릴리즈에 게시 ─────────────────────
      - name: Upload verified JAR and checksum
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          VERSION: ${{ steps.version.outputs.VERSION }}
        run: |
          JAR="context-engine-${VERSION}.jar"
          cp "build/libs/${JAR}" "$JAR"
          sha256sum "$JAR" > "${JAR}.sha256"
          cat "${JAR}.sha256"
          gh release upload "v${VERSION}" "$JAR" "${JAR}.sha256" --clobber

      # ── 검증된 동일 버전의 npm 패키지 publish ──────────────────────────────
      - name: Test, verify release asset, and publish npm package
        working-directory: npm
        run: |
          VERSION="${{ steps.version.outputs.VERSION }}"
          JAR="context-engine-${VERSION}.jar"
          BASE="https://github.com/dakcoh/commerce-context-mcp/releases/download/v${VERSION}"
          curl -fL "$BASE/$JAR" -o "$JAR"
          curl -fL "$BASE/$JAR.sha256" -o "$JAR.sha256"
          sha256sum -c "$JAR.sha256"
          npm whoami
          npm test
          node test/mcp-smoke.js "$JAR"
          npm pack --dry-run
          NPM_TAG="latest"
          if [[ "$VERSION" == *-* ]]; then NPM_TAG="next"; fi
          npm publish --access public --tag "$NPM_TAG"
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
