name: CI

# 데이터(YAML 지식)와 코드의 신뢰성을 매 변경마다 검증한다.
# 릴리즈(release.yml) 이전에 push/PR 단계에서 회귀를 차단하는 것이 목적이다.

on:
  push:
    branches: [master]
  pull_request:
    branches: [master]

jobs:
  build-and-validate:
    runs-on: ubuntu-latest
    permissions:
      contents: read

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'corretto'

      - name: Cache Gradle
        uses: actions/cache@v4
        with:
          path: |
            ~/.gradle/caches
            ~/.gradle/wrapper
          key: gradle-${{ hashFiles('**/*.gradle.kts', '**/gradle-wrapper.properties') }}

      # validateKnowledge 는 test 에 의존한다.
      # → YAML 지식 스키마/품질 검증 + 전체 단위·통합 테스트 + MCP 도구 등록 검증을 한 번에 수행한다.
      - name: Validate knowledge, run tests, and build JAR
        run: |
          chmod +x gradlew
          ./gradlew validateKnowledge bootJar --no-daemon

      # npm 실행기 최소 지원 버전에서 기능·패키징 검증
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Test npm launcher
        working-directory: npm
        run: |
          npm test
          node test/mcp-smoke.js ../build/libs/context-engine-0.1.0-SNAPSHOT.jar
          npm pack --dry-run
